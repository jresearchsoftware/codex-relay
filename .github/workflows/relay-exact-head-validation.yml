name: Public CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16

      - name: Set up Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update

      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          python3 --version
          cargo --version
          rustc --version
          git --version
          openssl version

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          git diff --check "$BASE_SHA" HEAD

      - name: Test Node.js components
        run: npm test

      - name: Qualify sandbox cleanup across synthetic Unix identities
        run: sudo python3 scripts/qualify-sandbox-cleanup.py

      - name: Check Reviewer formatting
        run: cargo fmt --manifest-path reviewer/Cargo.toml --check

      - name: Test Reviewer
        run: cargo test --manifest-path reviewer/Cargo.toml --locked

      - name: Qualify three consumers
        run: python3 scripts/qualify.py

      - name: Scan candidate
        run: python3 scripts/check-candidate.py

  runtime:
    name: Codex CLI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16

      - name: Prepare CLI qualification dependency
        run: python3 -m pip install PyYAML==6.0.2

      - name: Qualify exact official Codex release without model calls
        run: python3 deploy/ansible/tests/qualify_codex_cli.py

      - name: Test CLI and launcher contracts
        run: |
          # Keep ordinary-UID permission tests in their intended context.
          # Installed-runtime proof retains a separate privilege boundary.
          python3 -m unittest deploy.tests.test_consumer_workflows \
            deploy.ansible.tests.test_codex_runtime_contract \
            deploy.ansible.tests.test_production_codex_launcher_binding \
            deploy.ansible.tests.test_production_diagnostic
          node --import ./consumer/test-support/consumer-env.mjs --test deploy/ansible/tests/codex-launcher-*.test.mjs deploy/ansible/tests/diagnostics-*.test.mjs deploy/ansible/tests/diagnostic-snapshot.test.mjs
