name: Public CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16

      - name: Set up Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update

      - name: Record candidate and toolchain
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          python3 --version
          cargo --version
          rustc --version
          git --version
          openssl version

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          git diff --check "$BASE_SHA" HEAD

      - name: Test Node.js components
        run: npm test

      - name: Check Reviewer formatting
        run: cargo fmt --manifest-path reviewer/Cargo.toml --check

      - name: Test Reviewer
        run: cargo test --manifest-path reviewer/Cargo.toml --locked

      - name: Qualify three consumers
        run: python3 scripts/qualify.py

      - name: Scan candidate
        run: python3 scripts/check-candidate.py
