# Generated by Relay workflow projection; edit deploy/workflows/recovery.yml.in.
# Workflow contract: relay-workflows-v4; consumer review/merge remains required.
name: Writer publication recovery
run-name: Writer publication recovery · Run ${{ inputs.run_id }} · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the retained attempt or recover with a fresh owner comment
        required: true
        type: choice
        options: [inspect, recover, inspect-prepublication, recover-prepublication]
      run_id:
        description: Original routing run ID
        required: true
        type: string
      attempt_id:
        description: Original attempt ID, as recorded by Relay
        required: true
        type: string
      authorization_id:
        description: Fresh owner authorization comment ID, required for recovery
        required: false
        default: ''
        type: string
      candidate_head:
        description: Exact retained candidate SHA, required only for opt-in prepublication recovery
        required: false
        default: ''
        type: string


permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: "codex-relay-recovery-${{ inputs.run_id }}"
  cancel-in-progress: false
  queue: max

jobs:
  recover:
    if: >-
      ${{ github.repository == 'jresearchsoftware/codex-relay' &&
          github.actor == 'foal' && github.triggering_actor == 'foal' &&
          github.ref == 'refs/heads/main' }}
    # External scheduling restrictions remain required; see the workflow contract.
    runs-on: {"group": "codex-relay-general-runner", "labels": ["self-hosted", "Linux", "X64", "relay-pool-499b647027da1b90d2f73703"]}
    timeout-minutes: 15
    steps:
      - name: Recover through the accepted installed Writer boundary
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_CONSUMER_CONFIG: /etc/codex-relay/consumer.json
          RELAY_REPOSITORY: jresearchsoftware/codex-relay
          EXPECTED_WORKFLOW_CONTRACT: "relay-workflows-v4"
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_RUN_ID: ${{ inputs.run_id }}
          RECOVERY_ATTEMPT_ID: ${{ inputs.attempt_id }}
          RECOVERY_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          RECOVERY_HEAD: ${{ inputs.candidate_head }}

          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          case "$RUNNER_NAME:$(/usr/bin/id -un)" in
            codex-relay-general-runner:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=primary ;;
            codex-relay-general-runner-2:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-2 ;;
            codex-relay-general-runner-3:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-3 ;;
            codex-relay-general-runner-4:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-4 ;;
            codex-relay-general-runner-5:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-5 ;;
            codex-relay-general-runner-6:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-6 ;;
            codex-relay-general-runner-7:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-7 ;;
            codex-relay-general-runner-8:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-8 ;;
            codex-relay-general-runner-9:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-9 ;;
            codex-relay-general-runner-10:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-10 ;;
            codex-relay-general-runner-11:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-11 ;;
            codex-relay-general-runner-12:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-12 ;;
            codex-relay-general-runner-13:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-13 ;;
            codex-relay-general-runner-14:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-14 ;;
            codex-relay-general-runner-15:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-15 ;;
            codex-relay-general-runner-16:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-16 ;;
            codex-relay-general-runner-17:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-17 ;;
            codex-relay-general-runner-18:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-18 ;;
            codex-relay-general-runner-19:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-19 ;;
            codex-relay-general-runner-20:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-20 ;;
            codex-relay-general-runner-21:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-21 ;;
            codex-relay-general-runner-22:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-22 ;;
            codex-relay-general-runner-23:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-23 ;;
            codex-relay-general-runner-24:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-24 ;;
            codex-relay-general-runner-25:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-25 ;;
            codex-relay-general-runner-26:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-26 ;;
            codex-relay-general-runner-27:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-27 ;;
            codex-relay-general-runner-28:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-28 ;;
            codex-relay-general-runner-29:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-29 ;;
            codex-relay-general-runner-30:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-30 ;;
            codex-relay-general-runner-31:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-31 ;;
            codex-relay-general-runner-32:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-32 ;;
            *) echo RELAY_RUNNER_SLOT_IDENTITY_MISMATCH >&2; exit 1 ;;
          esac
          /usr/bin/node --input-type=module <<'NODE'
          import { readFile, realpath } from 'node:fs/promises';
          import { spawn } from 'node:child_process';
          const expectedContract = process.env.EXPECTED_WORKFLOW_CONTRACT;
          const release = await realpath('/opt/codex-relay/current');
          const identity = JSON.parse(await readFile(`${release}/reviewed-source/.relay-source.json`, 'utf8'));
          const head = identity.revision;
          const compatibility = JSON.parse(await readFile(`${release}/reviewed-source/deploy/workflows/contract.json`, 'utf8'));
          if (!/^[0-9a-f]{40}$/.test(head ?? '') || release !== `/opt/codex-relay/releases/${head}` ||
              compatibility[expectedContract === 'relay-workflows-v4' ? 'parallelWorkflowContract' : 'workflowContract'] !== expectedContract || !/^relay-workflows-v[1-9][0-9]*$/.test(expectedContract ?? '')) {
            throw new Error('INSTALLED_RELAY_IDENTITY_MISMATCH');
          }
          console.log(JSON.stringify({ installedRelayHead: head, workflowHead: process.env.GITHUB_SHA }));
          const positive = value => /^[1-9][0-9]*$/.test(value ?? '') && Number.isSafeInteger(Number(value));
          const operation = process.env.RECOVERY_OPERATION;
          const runId = process.env.RECOVERY_RUN_ID;
          const attemptId = process.env.RECOVERY_ATTEMPT_ID;
          const authorizationId = process.env.RECOVERY_AUTHORIZATION_ID;
          const candidateHead = process.env.RECOVERY_HEAD ?? '';
          const prepublication = operation === 'inspect-prepublication' || operation === 'recover-prepublication';
          const recovering = operation === 'recover' || operation === 'recover-prepublication';
          if (!positive(runId) || !/^(?:event|run)-[1-9][0-9]*$/.test(attemptId ?? '') ||
              !['inspect', 'recover', 'inspect-prepublication', 'recover-prepublication'].includes(operation) ||
              (recovering ? !positive(authorizationId) : authorizationId !== '') ||
              (prepublication ? !/^[a-f0-9]{40}$/.test(candidateHead) : candidateHead !== '')) {
            throw new Error('RECOVERY_REQUEST_INVALID');
          }
          const request = { runId: Number(runId), attemptId,
            ...(prepublication ? { operation, head: candidateHead, ...(recovering ? { authorizationId: Number(authorizationId) } : {}) }
              : operation === 'inspect' ? { operation } : { authorizationId: Number(authorizationId) }) };
          const child = spawn('/usr/bin/node', [`${release}/bin/relay-publication-recovery.mjs`],
            { stdio: ['pipe', 'inherit', 'inherit'] });
          child.stdin.on('error', () => { process.exitCode = 1; });
          child.on('error', () => { process.exitCode = 1; });
          child.on('exit', code => { process.exitCode = code ?? 1; });
          child.stdin.end(JSON.stringify(request));
          NODE
