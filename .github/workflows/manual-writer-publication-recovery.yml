          }
          const request = { runId: Number(runId), attemptId,
            ...(operation === 'inspect' ? { operation } : { authorizationId: Number(authorizationId) }) };
          const child = spawn('/usr/bin/node', [`${release}/bin/relay-publication-recovery.mjs`],
            { stdio: ['pipe', 'inherit', 'inherit'] });
          child.stdin.on('error', () => { process.exitCode = 1; });
          child.on('error', () => { process.exitCode = 1; });
          child.on('exit', code => { process.exitCode = code ?? 1; });
          child.stdin.end(JSON.stringify(request));
          NODE
