# Generated by Relay workflow projection; edit deploy/workflows/routing.yml.in.
# Workflow contract: relay-workflows-v4; consumer review/merge remains required.
name: Relay routing
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('{0} · Task {1}{2}{3}', inputs.route == 'manual' && 'Manual handoff' || inputs.pull_request != '' && 'Auto remediation' || 'Auto implementation', inputs.task, inputs.step != '' && format(' · Step {0}', inputs.step) || '', inputs.pull_request != '' && format(' · PR #{0}', inputs.pull_request) || '') ||
      github.event_name == 'issues' &&
      format('{0} · Task {1} · {2}', github.event.label.name == 'codex-ready-manual' && 'Manual handoff' || 'Auto implementation', github.event.issue.number,
      (contains(format('{0}{1}{0}', fromJSON('"\n"'), github.event.issue.body), format('{0}Authority model: github-native-v1{0}', fromJSON('"\n"'))) ||
      contains(format('{0}{1}{0}', fromJSON('"\n"'), github.event.issue.body), format('{0}Authority model: github-native-v1{1}{0}', fromJSON('"\n"'), fromJSON('"\r"')))) && github.event.label.name || join(github.event.issue.labels.*.name, ' · ')) ||
      format('{0} · PR #{1} · {2}', github.event.label.name == 'codex-ready-manual' && 'Manual handoff' || 'Auto remediation', github.event.pull_request.number, github.event.pull_request.title) }}

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      task:
        description: Canonical Issue number
        required: true
        type: string
      step:
        description: Legacy Step hint; native admission allocates its own Step
        required: false
        default: ''
        type: string
      route:
        description: Admitted execution route
        required: true
        type: choice
        options: [auto, manual]
      pull_request:
        description: Existing remediation PR number, if applicable
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: "codex-relay-control-${{ github.event_name == 'workflow_dispatch' && format('issue-{0}', inputs.task) || github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || format('pull-{0}', github.event.pull_request.number) }}"
  cancel-in-progress: false
  queue: max

jobs:
  route:
    if: >-
      ${{ github.repository == 'jresearchsoftware/codex-relay' &&
          github.actor == 'foal' && github.triggering_actor == 'foal' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.action == 'labeled' &&
           (github.event.label.name == 'codex-ready-auto' || github.event.label.name == 'codex-ready-manual')) &&
          (github.event_name != 'pull_request_target' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    # Labels/if/identity checks are not the external runner scheduling boundary.
    # Keep runners inactive until the external runner restrictions are qualified.
    runs-on: {"group": "codex-relay-general-runner", "labels": ["self-hosted", "Linux", "X64", "relay-pool-e6987beab0b057123d402738"]}
    timeout-minutes: 120
    steps:
      - name: Run the accepted installed Relay
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_CONSUMER_CONFIG: /etc/codex-relay/consumer.json
          RELAY_REPOSITORY: jresearchsoftware/codex-relay
          EXPECTED_WORKFLOW_CONTRACT: "relay-workflows-v4"
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          case "$RUNNER_NAME:$(/usr/bin/id -un)" in
            codex-relay-general-runner-pool:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=primary ;;
            codex-relay-general-runner-pool-2:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-2 ;;
            codex-relay-general-runner-pool-3:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-3 ;;
            codex-relay-general-runner-pool-4:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-4 ;;
            codex-relay-general-runner-pool-5:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-5 ;;
            codex-relay-general-runner-pool-6:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-6 ;;
            codex-relay-general-runner-pool-7:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-7 ;;
            codex-relay-general-runner-pool-8:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-8 ;;
            codex-relay-general-runner-pool-9:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-9 ;;
            codex-relay-general-runner-pool-10:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-10 ;;
            codex-relay-general-runner-pool-11:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-11 ;;
            codex-relay-general-runner-pool-12:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-12 ;;
            codex-relay-general-runner-pool-13:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-13 ;;
            codex-relay-general-runner-pool-14:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-14 ;;
            codex-relay-general-runner-pool-15:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-15 ;;
            codex-relay-general-runner-pool-16:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-16 ;;
            codex-relay-general-runner-pool-17:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-17 ;;
            codex-relay-general-runner-pool-18:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-18 ;;
            codex-relay-general-runner-pool-19:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-19 ;;
            codex-relay-general-runner-pool-20:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-20 ;;
            codex-relay-general-runner-pool-21:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-21 ;;
            codex-relay-general-runner-pool-22:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-22 ;;
            codex-relay-general-runner-pool-23:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-23 ;;
            codex-relay-general-runner-pool-24:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-24 ;;
            codex-relay-general-runner-pool-25:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-25 ;;
            codex-relay-general-runner-pool-26:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-26 ;;
            codex-relay-general-runner-pool-27:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-27 ;;
            codex-relay-general-runner-pool-28:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-28 ;;
            codex-relay-general-runner-pool-29:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-29 ;;
            codex-relay-general-runner-pool-30:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-30 ;;
            codex-relay-general-runner-pool-31:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-31 ;;
            codex-relay-general-runner-pool-32:codex-relay-general-runner) export RELAY_EXECUTION_SLOT=pool-32 ;;
            *) echo RELAY_RUNNER_SLOT_IDENTITY_MISMATCH >&2; exit 1 ;;
          esac
          exec /usr/bin/node --input-type=module <<'NODE'
          import { readFile, realpath } from 'node:fs/promises';
          const expectedContract = process.env.EXPECTED_WORKFLOW_CONTRACT;
          const release = await realpath('/opt/codex-relay/current');
          const identity = JSON.parse(await readFile(`${release}/reviewed-source/.relay-source.json`, 'utf8'));
          const head = identity.revision;
          const compatibility = JSON.parse(await readFile(`${release}/reviewed-source/deploy/workflows/contract.json`, 'utf8'));
          if (!/^[0-9a-f]{40}$/.test(head ?? '') || release !== `/opt/codex-relay/releases/${head}` ||
              compatibility[expectedContract === 'relay-workflows-v4' ? 'parallelWorkflowContract' : 'workflowContract'] !== expectedContract || !/^relay-workflows-v[1-9][0-9]*$/.test(expectedContract ?? '')) {
            throw new Error('INSTALLED_RELAY_IDENTITY_MISMATCH');
          }
          console.log(JSON.stringify({ installedRelayHead: head, workflowHead: process.env.GITHUB_SHA }));
          const { main, reportRoutingResult } = await import(`${release}/bin/relay-routing.mjs`);
          process.exitCode = await reportRoutingResult(main);
          NODE
