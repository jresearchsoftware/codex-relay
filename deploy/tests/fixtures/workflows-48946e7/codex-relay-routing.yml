name: Relay routing
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('{0} · Task {1} · Step {2}{3}', inputs.route == 'manual' && 'Manual handoff' || inputs.pull_request != '' && 'Auto remediation' || 'Auto implementation', inputs.task, inputs.step, inputs.pull_request != '' && format(' · PR #{0}', inputs.pull_request) || '') ||
      github.event_name == 'issues' &&
      format('{0} · Task {1} · {2}', github.event.label.name == 'codex-ready-manual' && 'Manual handoff' || 'Auto implementation', github.event.issue.number, join(github.event.issue.labels.*.name, ' · ')) ||
      format('{0} · PR #{1} · {2}', github.event.label.name == 'codex-ready-manual' && 'Manual handoff' || 'Auto remediation', github.event.pull_request.number, github.event.pull_request.title) }}

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Canonical Issue number
        required: true
        type: string
      step:
        description: Current admitted positive Step
        required: true
        type: string
      route:
        description: Admitted execution route
        required: true
        type: choice
        options: [auto, manual]
      pull_request:
        description: Existing remediation PR number, if applicable
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-relay-control
  cancel-in-progress: false

jobs:
  route:
    if: >-
      ${{ github.repository == 'jresearchsoftware/codex-relay' &&
          github.actor == 'foal' && github.triggering_actor == 'foal' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.action == 'labeled' &&
           (github.event.label.name == 'codex-ready-auto' || github.event.label.name == 'codex-ready-manual')) &&
          (github.event_name != 'pull_request_target' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    # Labels/if/identity checks are not the external runner scheduling boundary.
    # Keep runners inactive until docs/self-dogfood-workflows.md is qualified.
    runs-on: [self-hosted, Linux, X64, codex-relay]
    timeout-minutes: 120
    steps:
      - name: Run the accepted installed Relay
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_CONSUMER_CONFIG: /etc/codex-relay/consumer.json
          EXPECTED_RELAY_HEAD: ${{ github.sha }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          test "$RUNNER_NAME" = codex-relay-general-runner
          test "$(/usr/bin/id -un)" = codex-relay-general-runner
          /usr/bin/node --input-type=module <<'NODE'
          import { readFile, realpath } from 'node:fs/promises';
          const head = process.env.EXPECTED_RELAY_HEAD;
          const release = await realpath('/opt/codex-relay/current');
          const identity = JSON.parse(await readFile(`${release}/reviewed-source/.relay-source.json`, 'utf8'));
          if (!/^[0-9a-f]{40}$/.test(head ?? '') || release !== `/opt/codex-relay/releases/${head}` || identity.revision !== head) {
            throw new Error('INSTALLED_RELAY_HEAD_MISMATCH');
          }
          console.log(JSON.stringify({ installedRelayHead: head, workflowHead: process.env.GITHUB_SHA }));
          const { main, reportRoutingResult } = await import(`${release}/bin/relay-routing.mjs`);
          process.exitCode = await reportRoutingResult(main);
          NODE
