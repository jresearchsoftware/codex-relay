---
- name: Read-only preflight and APT metadata preparation for TLS
  hosts: relay
  become: true
  gather_facts: true
  roles:
    - role: relay_preflight
    - role: relay_apt_metadata

- name: Prepare shared Certbot and relay-owned OpenAI client CA
  hosts: relay
  become: true
  gather_facts: false
  roles:
    - role: relay_tls
