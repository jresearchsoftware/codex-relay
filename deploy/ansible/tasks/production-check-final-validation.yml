---
# This is the read-only terminal classifier for a zero-apply check. It does
# not classify Ansible changed=0 as proof and it does not fail ordinary drift:
# the workflow must still be able to admit exactly one apply. site.yml runs
# the ordinary runtime namespace and address-bound Reviewer copy
# tasks in check-mode, so their planned changes participate in that same
# changed-count decision. The proof is emitted by site.yml only when this
# candidate is true; a zero-change check without that proof is rejected by
# run-production.sh.

- name: Classify an unrecovered production operation for stable check proof
  ansible.builtin.set_fact:
    relay_production_check_operation_stable: >-
      {{
        not relay_production_operation_recovery_required | default(false) | bool and
        not relay_production_recovery_check_classified | default(false) | bool and
        relay_reviewer_bind_mode == 'nexus_gateway' and
        relay_reviewer_gateway_validated | bool and
        relay_reviewer_bind_network == relay_docker_network_name and
        relay_reviewer_bind_address is defined and
        relay_reviewer_bind_address | length > 0
      }}
  changed_when: false

- name: Classify the exact current release and non-secret manifest binding
  ansible.builtin.set_fact:
    relay_production_check_release_stable: >-
      {{
        relay_production_final_paths.results | default([]) | length == 11 and
        relay_production_final_paths.results[0].stat.exists | default(false) and
        relay_production_final_paths.results[0].stat.islnk | default(false) and
        not relay_production_final_paths.results[0].stat.isreg | default(false) and
        (relay_production_final_paths.results[0].stat.lnk_source | default('')).startswith(relay_release_root ~ '/') and
        (relay_production_final_paths.results[0].stat.lnk_source | default('') | basename) == relay_production_operation_target_head and
        relay_production_final_paths.results[0].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[1].stat.exists | default(false) and
        relay_production_final_paths.results[1].stat.isreg | default(false) and
        not relay_production_final_paths.results[1].stat.islnk | default(false) and
        relay_production_final_paths.results[1].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[1].stat.gr_name | default('') == 'root' and
        relay_production_final_paths.results[1].stat.mode | default('') == '0640' and
        (relay_production_final_manifest | default({})).schemaVersion | default('') == '1.0' and
        (relay_production_final_manifest | default({})).commit | default('') == relay_production_operation_target_head
      }}
  changed_when: false

- name: Classify the stable Reviewer and runner runtime shape
  ansible.builtin.set_fact:
    relay_production_check_runtime_stable: >-
      {{
        relay_production_final_paths.results | default([]) | length == 11 and
        relay_production_final_paths.results[2].stat.exists | default(false) and
        relay_production_final_paths.results[2].stat.isreg | default(false) and
        not relay_production_final_paths.results[2].stat.islnk | default(false) and
        relay_production_final_paths.results[2].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[3].stat.exists | default(false) and
        relay_production_final_paths.results[3].stat.isreg | default(false) and
        not relay_production_final_paths.results[3].stat.islnk | default(false) and
        relay_production_final_paths.results[3].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[4].stat.exists | default(false) and
        relay_production_final_paths.results[4].stat.isreg | default(false) and
        not relay_production_final_paths.results[4].stat.islnk | default(false) and
        relay_production_final_paths.results[4].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[5].stat.exists | default(false) and
        relay_production_final_paths.results[5].stat.isreg | default(false) and
        not relay_production_final_paths.results[5].stat.islnk | default(false) and
        relay_production_final_paths.results[5].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[10].stat.exists | default(false) and
        relay_production_final_paths.results[10].stat.isreg | default(false) and
        not relay_production_final_paths.results[10].stat.islnk | default(false) and
        relay_production_final_paths.results[10].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[10].stat.mode | default('') == '0755' and
        relay_production_final_services.results[0].stdout | trim in ['active', 'inactive', 'failed'] and
        relay_production_final_services.results[1].stdout | trim in ['enabled', 'enabled-runtime', 'disabled'] and
        relay_production_final_services.results[2].stdout | trim in ['active', 'inactive', 'failed'] and
        relay_production_final_services.results[3].stdout | trim in ['enabled', 'enabled-runtime', 'disabled'] and
        (
          (
            relay_production_final_services.results[0].stdout | trim == 'active' and
            relay_production_final_services.results[1].stdout | trim in ['enabled', 'enabled-runtime'] and
            relay_production_final_listener.stdout | default('') is search((relay_reviewer_bind_address ~ ':8787') | regex_escape)
          ) or
          (
            relay_production_final_services.results[0].stdout | trim in ['inactive', 'failed'] and
            not (relay_production_final_listener.stdout | default('') is search((relay_reviewer_bind_address ~ ':8787') | regex_escape))
          )
        )
      }}
  changed_when: false

- name: Inspect the final Reviewer bind configuration for stable check proof
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |-
        import json
        import sys

        path, expected_mode, expected_address, expected_network = sys.argv[1:]
        try:
            with open(path, encoding='utf-8') as stream:
                service = json.load(stream)['service']
        except (AttributeError, OSError, KeyError, TypeError, ValueError):
            raise SystemExit(1)
        raise SystemExit(0 if (
            service.get('bind_mode') == expected_mode and
            service.get('bind_address') == expected_address and
            service.get('bind_network') == expected_network and
            service.get('gateway_validated') is True
        ) else 1)
      - '{{ relay_config_root }}/reviewer-mcp.json'
      - '{{ relay_reviewer_bind_mode }}'
      - '{{ relay_reviewer_bind_address }}'
      - '{{ relay_reviewer_bind_network }}'
  register: relay_production_check_bind_config_validation
  changed_when: false
  failed_when: false
  check_mode: false

- name: Classify the fixed Writer entrypoint for stable check proof
  ansible.builtin.set_fact:
    relay_production_check_writer_stable: >-
      {{
        relay_production_final_paths.results | default([]) | length == 11 and
        relay_production_final_paths.results[8].stat.exists | default(false) and
        relay_production_final_paths.results[8].stat.isreg | default(false) and
        not relay_production_final_paths.results[8].stat.islnk | default(false) and
        relay_production_final_paths.results[8].stat.pw_name | default('') == 'root' and
        relay_production_final_paths.results[8].stat.gr_name | default('') == 'root' and
        relay_production_final_paths.results[8].stat.mode | default('') == '0750' and
        relay_production_final_paths.results[9].stat.exists | default(false) and
        relay_production_final_paths.results[9].stat.isreg | default(false) and
        not relay_production_final_paths.results[9].stat.islnk | default(false) and
        relay_production_final_paths.results[9].stat.pw_name | default('') == 'root' and
        (relay_production_final_writer_entrypoint | default('')) is search((relay_install_root ~ '/current/reviewed-source/controller/src/privileged-writer-helper.mjs') | regex_escape) and
        not ((relay_production_final_writer_entrypoint | default('')) is search(relay_release_root | regex_escape)) and
        (relay_production_final_writer_entrypoint | default('')) is search('test "[$]#" -eq 0') and
        (relay_production_final_writer_entrypoint | default('')) is search('/usr/bin/env -i') and
        (relay_production_final_writer_entrypoint | default('')) is search('RELAY_WRITER_CLAIM_ROOT=')
      }}
  changed_when: false

- name: Classify the authoritative stable no-op check candidate
  ansible.builtin.set_fact:
    relay_production_check_stable: >-
      {{
        relay_production_check_operation_stable | bool and
        relay_production_check_release_stable | bool and
        relay_production_check_runtime_stable | bool and
        relay_production_check_bind_config_validation.rc == 0 and
        relay_production_check_writer_stable | bool
      }}
  changed_when: false
