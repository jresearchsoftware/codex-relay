---
# Admission is quiesced and drained. Revalidate actual service intent before
# retaining the FIRST snapshot; recovery must keep the original owner intent.
- name: Observe original service intent before retaining the managed snapshot
  ansible.builtin.include_tasks: upgrade-lifecycle-observe.yml

- name: Retain the first activation snapshot in the exact protected admission operation
  ansible.builtin.command:
    argv: '{{ (relay_intent_admission_prefix | default([relay_install_root ~ "/relay-admission"])) + ["snapshot", "--operation", relay_admission_operation_id] }}'
    stdin: '{{ relay_upgrade_lifecycle_snapshot_activity | to_json }}'
    stdin_add_newline: false
  register: relay_upgrade_lifecycle_retained_snapshot
  changed_when: false
  check_mode: false

- name: Read the original activation intent retained across recovery
  ansible.builtin.set_fact:
    relay_upgrade_lifecycle_previous_active: >-
      {{ {'manualOutcome': {'active': false, 'enabled': 'disabled', 'load': 'not-found'}} |
         combine((relay_upgrade_lifecycle_retained_snapshot.stdout | from_json).previousActive) }}

- name: Prove explicitly owner-maintained runners before selecting recovery activity
  ansible.builtin.include_tasks: upgrade-maintained-runners.yml
  when:
    - relay_admission_recovery_authorized | default(false) | bool
    - (relay_bounded_recovery_binding | default({})).runnerMaintenance is defined

- name: Select original activity when no maintained Runner continuation was declared
  ansible.builtin.set_fact:
    relay_upgrade_lifecycle_effective_active: '{{ relay_upgrade_lifecycle_previous_active }}'
  when: relay_upgrade_lifecycle_maintenance_proof is not defined

- name: Retain the previously active components and general transport identity
  ansible.builtin.set_fact:
    relay_upgrade_lifecycle_reviewer_was_active: '{{ relay_upgrade_lifecycle_effective_active.reviewer.active }}'
    relay_upgrade_lifecycle_production_was_active: '{{ relay_upgrade_lifecycle_effective_active.production.active }}'
    relay_upgrade_lifecycle_general_was_active: '{{ relay_upgrade_lifecycle_effective_active.general.active }}'

- name: Require exact retained intent before any managed recovery activation
  ansible.builtin.assert:
    that:
      - not relay_upgrade_lifecycle_observed_activity[item].active or relay_upgrade_lifecycle_effective_active[item].active
      - >-
        not relay_upgrade_lifecycle_previous_active[item].active or
        relay_upgrade_lifecycle_observed_activity[item].active or
        (item not in (['general'] + (relay_additional_execution_slots | default([]) | map(attribute='relay_execution_slot') | map('regex_replace', '^', 'slot-') | list)) and relay_admission_recovery_authorized | default(false) | bool)
    fail_msg: RELAY_UPGRADE_RETAINED_ACTIVITY_RECOVERY_REQUIRED
  loop: '{{ relay_upgrade_lifecycle_observed_activity.keys() | list }}'

- name: Require the active production runner to retain its Reviewer prerequisite
  ansible.builtin.assert:
    that:
      - not relay_upgrade_lifecycle_production_was_active | bool or relay_upgrade_lifecycle_reviewer_was_active | bool
    fail_msg: RELAY_UPGRADE_PRODUCTION_REVIEWER_ACTIVITY_UNPROVEN

- name: Inspect loaded process inputs before ordinary managed Apply changes
  ansible.builtin.include_tasks: upgrade-loaded-process-proof.yml
  when:
    - relay_upgrade_lifecycle_reviewer_was_active | bool
    - not relay_admission_recovery_authorized | default(false) | bool
    - relay_upgrade_lifecycle_maintenance_proof is not defined
    - relay_runtime_root is defined
    - relay_reviewer_credential_env_file is defined
    - relay_reviewer_user is defined

- name: Retain eligible loaded process identity for this traversal only
  ansible.builtin.set_fact:
    relay_upgrade_loaded_process_before: '{{ relay_upgrade_loaded_process_observed.proof }}'
  when: (relay_upgrade_loaded_process_observed | default({})).eligible | default(false) | bool
