---
- name: Inspect generic runtime roots before ownership reconciliation
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop: ['{{ relay_dispatch_state_root }}', '{{ relay_dispatch_work_root }}', '{{ relay_dispatch_home }}', '{{ relay_dispatch_evidence_root }}']
  register: general_runtime_roots

- name: Refuse aliased generic runtime roots
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
    fail_msg: GENERAL_RUNNER_RUNTIME_ROOT_UNSAFE
  loop: '{{ general_runtime_roots.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Create the general runner primary group
  ansible.builtin.group:
    name: '{{ relay_runner_group }}'
    system: true

- name: Inspect the existing shared runner account without changing its login settings
  ansible.builtin.getent:
    database: passwd
    key: '{{ relay_runner_user }}'
    fail_key: false
  register: relay_general_existing_account
  changed_when: false
  when: relay_general_runner_pool is defined and relay_execution_slot | default('primary') == 'primary'

- name: Create the isolated general runner identity with only Codex work membership
  ansible.builtin.user:
    name: '{{ relay_runner_user }}'
    group: '{{ omit if relay_general_runner_pool is defined and (relay_general_existing_account.ansible_facts.getent_passwd | default({})).get(relay_runner_user) else relay_runner_group }}'
    groups: ['{{ relay_codex_work_group }}']
    append: '{{ relay_general_runner_pool is defined }}'
    system: true
    create_home: false
    home: '{{ omit if relay_general_runner_pool is defined and (relay_general_existing_account.ansible_facts.getent_passwd | default({})).get(relay_runner_user) else relay_runner_home }}'
    shell: '{{ omit if relay_general_runner_pool is defined and (relay_general_existing_account.ansible_facts.getent_passwd | default({})).get(relay_runner_user) else "/usr/sbin/nologin" }}'
  register: relay_general_runtime_identity
  when: relay_general_runner_pool is not defined or relay_execution_slot | default('primary') == 'primary'

- name: Refuse stale identity or supplementary groups in the live general transport
  ansible.builtin.assert:
    that:
      - not relay_general_runtime_identity.changed | bool
    fail_msg: RELAY_UPGRADE_GENERAL_TRANSPORT_IDENTITY_RESTART_REQUIRED
  when:
    - relay_upgrade_lifecycle_managed | default(false) | bool
    - relay_upgrade_lifecycle_general_was_active | default(false) | bool
    - not ansible_check_mode | bool
    - relay_general_runner_pool is not defined or relay_execution_slot | default('primary') == 'primary'

# These are the existing generic routing namespaces, not production runner
# state. Preserve journal bytes and old attempts; never transfer worker-owned
# checkout contents or broaden relay-codex access to the runner journal.
- name: Preserve the private routing and shared Codex work boundaries
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ relay_runner_user }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - {path: '{{ relay_dispatch_state_root }}', group: '{{ relay_runner_group }}', mode: '0700'}
    - {path: '{{ relay_dispatch_home }}', group: '{{ relay_runner_group }}', mode: '0700'}
    - {path: '{{ relay_dispatch_evidence_root }}', group: '{{ relay_runner_group }}', mode: '0700'}
    - {path: '{{ relay_dispatch_work_root }}', group: '{{ relay_codex_work_group }}', mode: '2770'}

- name: Assign existing generic dispatch journals to the general runner
  ansible.builtin.file:
    path: '{{ relay_dispatch_state_root }}'
    state: directory
    owner: '{{ relay_runner_user }}'
    group: '{{ relay_runner_group }}'
    recurse: true
    follow: false

# Reuse the existing typed helpers. Separate files keep production-user and
# general-user grants distinct on every apply, without general local apply.
- name: Install only the existing automatic relay sudo capabilities for the general identity
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '/etc/sudoers.d/{{ relay_namespace }}-{{ "slot-" ~ relay_execution_slot if relay_execution_slot | default("primary") != "primary" else "general" }}-{{ item.name }}'
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  loop:
    - {name: writer, src: '{{ role_path }}/../relay_controller/templates/relay-writer-controller.sudoers.j2'}
    - {name: diagnostics, src: '{{ role_path }}/../relay_controller/templates/relay-diagnostics.sudoers.j2'}
    - {name: codex, src: '{{ role_path }}/../relay_codex_runtime/templates/relay-codex.sudoers.j2'}
