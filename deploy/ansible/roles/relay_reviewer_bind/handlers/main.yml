---
- name: Reload systemd manager for validated bind mode
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not ansible_check_mode | bool
    - >-
      relay_service_effective_enabled | bool or
      (
        relay_deployment_profile == 'production' and
        (relay_service_state_management | default('enforce') | lower) == 'preserve'
      )
    - >-
      relay_reviewer_bind_post_activation_authorized | bool or
      (
        relay_deployment_profile == 'production' and
        (relay_service_state_management | default('enforce') | lower) == 'preserve'
      )

- name: Try-restart Reviewer for validated bind mode
  ansible.builtin.command:
    argv:
      - /bin/systemctl
      - try-restart
      - '{{ relay_reviewer_service_name }}'
  changed_when: true
  when:
    - not relay_production_defer_lifecycle | default(false) | bool
    - not ansible_check_mode | bool
    - not (
        relay_deployment_profile == 'production' and
        relay_production_operation_record_present | default(false) | bool
      )
    - >-
      relay_service_effective_enabled | bool or
      (
        relay_deployment_profile == 'production' and
        (relay_service_state_management | default('enforce') | lower) == 'preserve'
      )

- name: Try-restart Reviewer for validated bind mode under the apply lock
  listen: Try-restart Reviewer for validated bind mode
  ansible.builtin.command:
    argv:
      - '{{ relay_reviewer_operation_restart_path }}'
  changed_when: true
  when:
    - not relay_production_defer_lifecycle | default(false) | bool
    - relay_deployment_profile == 'production'
    - relay_production_operation_record_present | default(false) | bool
    - relay_production_operation_phase | default('') == 'apply'
    - not relay_production_operation_recovery_required | default(false) | bool
    - not ansible_check_mode | bool
    - >-
      relay_service_effective_enabled | bool or
      (
        (relay_service_state_management | default('enforce') | lower) == 'preserve'
      )
    - >-
      relay_reviewer_bind_post_activation_authorized | bool or
      (
        relay_deployment_profile == 'production' and
        (relay_service_state_management | default('enforce') | lower) == 'preserve'
      )
