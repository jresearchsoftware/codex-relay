---
- name: Try-restart Reviewer after release transition
  ansible.builtin.command:
    argv:
      - /bin/systemctl
      - try-restart
      - '{{ relay_reviewer_service_name }}'
  changed_when: true
  when:
    - not relay_production_defer_lifecycle | default(false) | bool
    - relay_deployment_profile == 'production'
    - not ansible_check_mode | bool
    - not relay_production_operation_record_present | default(false) | bool
    - not relay_production_operation_recovery_required | default(false) | bool

- name: Try-restart Reviewer after release transition under the apply lock
  listen: Try-restart Reviewer after release transition
  ansible.builtin.command:
    argv:
      - '{{ relay_reviewer_operation_restart_path }}'
  changed_when: true
  when:
    - not relay_production_defer_lifecycle | default(false) | bool
    - relay_deployment_profile == 'production'
    - relay_production_operation_record_present | default(false) | bool
    - relay_production_operation_phase | default('') == 'apply'
    - not relay_production_operation_recovery_required | default(false) | bool
    - not ansible_check_mode | bool
