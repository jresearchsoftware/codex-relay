---
- name: Reconcile the shared dispatcher and diagnostic runtime entrypoints
  ansible.builtin.include_tasks: runtime-entrypoints.yml

- name: Create root-owned Writer publication record namespace
  ansible.builtin.file:
    path: '{{ relay_writer_claim_root }}'
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install the fixed root-owned on-demand Writer/Controller helper wrapper
  ansible.builtin.template:
    src: relay-writer-controller.j2
    dest: '{{ relay_writer_helper_path }}'
    owner: root
    group: root
    mode: '0750'

- name: Install the fixed Reviewer-accessible manual Outcome client
  ansible.builtin.template:
    src: relay-manual-outcome.j2
    dest: '{{ relay_install_root }}/relay-manual-outcome'
    owner: root
    group: '{{ relay_reviewer_group }}'
    mode: '0750'

- name: Install the root-only bounded manual Outcome Writer wrapper
  ansible.builtin.template:
    src: relay-manual-outcome-writer.j2
    dest: '{{ relay_install_root }}/relay-manual-outcome-writer'
    owner: root
    group: root
    mode: '0700'

- name: Install the separated bounded manual Outcome socket units
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ relay_namespace }}-{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [relay-manual-outcome.socket, 'relay-manual-outcome@.service']

- name: Preserve manual Outcome socket activity and enablement during managed upgrade
  ansible.builtin.systemd:
    name: '{{ relay_namespace }}-relay-manual-outcome.socket'
    daemon_reload: true
    state: '{{ "started" if relay_upgrade_lifecycle_previous_active.manualOutcome.active | default(false) | bool else "stopped" }}'
  when:
    - not ansible_check_mode | bool
    - relay_upgrade_lifecycle_managed | default(false) | bool

- name: Activate the bounded manual Outcome socket after supported installation
  ansible.builtin.systemd:
    name: '{{ relay_namespace }}-relay-manual-outcome.socket'
    daemon_reload: true
    enabled: true
    state: started
  when:
    - not ansible_check_mode | bool
    - not relay_upgrade_lifecycle_managed | default(false) | bool

- name: Inspect the installed bounded manual Outcome socket state
  ansible.builtin.command:
    argv: ['/bin/systemctl', show, '{{ relay_namespace }}-relay-manual-outcome.socket', '--property=LoadState,ActiveState,SubState,UnitFileState']
  register: relay_manual_outcome_socket_state
  changed_when: false
  when: not ansible_check_mode | bool

- name: Require the installed manual Outcome socket to retain admitted activity
  ansible.builtin.assert:
    that:
      - relay_manual_outcome_socket_state.stdout is search('(?m)^LoadState=loaded$')
      - >-
        (relay_upgrade_lifecycle_managed | default(false) | bool and
         not (relay_upgrade_lifecycle_previous_active.manualOutcome.active | default(false) | bool)) or
        (relay_manual_outcome_socket_state.stdout is search('(?m)^ActiveState=active$') and
         relay_manual_outcome_socket_state.stdout is search('(?m)^SubState=listening$'))
      - >-
        relay_upgrade_lifecycle_managed | default(false) | bool or
        relay_manual_outcome_socket_state.stdout is search('(?m)^UnitFileState=enabled$')
    fail_msg: RELAY_MANUAL_OUTCOME_SOCKET_STATE_UNPROVEN
  when: not ansible_check_mode | bool

- name: Install the root-only credential-free lifecycle admission helper
  ansible.builtin.template:
    src: relay-admission.j2
    dest: '{{ relay_install_root }}/relay-admission'
    owner: root
    group: root
    mode: '0750'

- name: Initialize missing lifecycle admission state without reopening retained state
  ansible.builtin.command:
    argv: ['{{ relay_install_root }}/relay-admission', 'initialize']
  register: relay_admission_initialized
  changed_when: false
  when:
    - not ansible_check_mode | bool
    - not relay_upgrade_lifecycle_managed | default(false) | bool

- name: Preserve the required admission gate during managed lifecycle installation
  ansible.builtin.command:
    argv: ['{{ relay_install_root }}/relay-admission', 'status']
  register: relay_admission_preserved
  changed_when: false
  when:
    - not ansible_check_mode | bool
    - relay_upgrade_lifecycle_managed | default(false) | bool

- name: Install the narrowly scoped runner sudoers rule for the Writer helper
  ansible.builtin.template:
    src: relay-writer-controller.sudoers.j2
    dest: '{{ relay_writer_sudoers_file }}'
    owner: root
    group: root
    mode: '0440'

- name: Validate the installed Writer helper sudoers rule
  ansible.builtin.command:
    argv: ['/usr/sbin/visudo', '-cf', '{{ relay_writer_sudoers_file }}']
  register: relay_writer_sudoers_check
  changed_when: false
  check_mode: false
  when: not ansible_check_mode | bool

- name: Record the non-mutating Writer privilege boundary plan
  ansible.builtin.debug:
    msg: 'WRITER_HELPER_CHECK_MODE_PLAN=fixed-helper-only; helper={{ relay_writer_helper_path }}; claimRoot={{ relay_writer_claim_root }}; binding={{ relay_writer_helper_release_path }}'
  when: ansible_check_mode | bool
