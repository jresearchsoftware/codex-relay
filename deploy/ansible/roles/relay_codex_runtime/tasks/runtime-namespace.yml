---
# A failed loop item would still allow the child path through a symlink parent.
- name: Reconcile the Codex temporary roots for the runtime identity
  ansible.builtin.file:
    path: '{{ relay_codex_home }}/tmp'
    state: directory
    owner: '{{ relay_codex_user }}'
    group: '{{ relay_codex_group }}'
    mode: '0700'
    follow: false

- name: Reconcile the Codex arg0 root after its temporary parent
  ansible.builtin.file:
    path: '{{ relay_codex_home }}/tmp/arg0'
    state: directory
    owner: '{{ relay_codex_user }}'
    group: '{{ relay_codex_group }}'
    mode: '0700'
    follow: false

- name: Reconcile ownership of stale Codex arg0 temporary descendants
  ansible.builtin.file:
    path: '{{ relay_codex_home }}/tmp/arg0'
    state: directory
    owner: '{{ relay_codex_user }}'
    group: '{{ relay_codex_group }}'
    recurse: true
    follow: false
