---
# The complete root-owned distribution is outside every private runtime home.
# The existing command path and all launcher/token boundaries stay unchanged.
- name: Qualify and normalize only the fixed complete official package namespace
  ansible.builtin.command:
    argv: ['/usr/bin/python3', '-I', '-c', '{{ lookup("file", role_path + "/files/relay-codex-package-guard.py") }}',
           '{{ relay_codex_package_home }}',
           '{{ (relay_codex_package_install_dir if relay_codex_install_needed | default(false) | bool else relay_codex_install_dir) }}/codex',
           '{{ relay_codex_cli_version }}',
           '{{ "normalize" if relay_codex_install_needed | default(false) | bool else "check" }}']
  register: relay_codex_package_qualified
  changed_when: relay_codex_install_needed | default(false) | bool

- name: Publish the same fixed CLI entrypoint to the qualified immutable payload
  ansible.builtin.file:
    src: '{{ (relay_codex_package_qualified.stdout | from_json).binary }}'
    dest: '{{ relay_codex_binary_path }}'
    state: link
    force: true
    owner: root
    group: root
    follow: false

- name: Verify the installed CLI is executable by its runtime identity without credentials
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, '{{ relay_codex_user }}', --, '{{ relay_codex_binary_path }}', --version]
  environment:
    CODEX_HOME: '{{ relay_codex_home }}'
  changed_when: false
  register: relay_codex_runtime_user_version
  failed_when: relay_codex_runtime_user_version.rc != 0 or (relay_codex_runtime_user_version.stdout | trim) != 'codex-cli ' ~ relay_codex_cli_version
  when: not ansible_check_mode | bool
