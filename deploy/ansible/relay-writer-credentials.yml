---
- name: Stage only the explicitly admitted existing Writer App credential
  hosts: relay
  become: true
  gather_facts: false
  pre_tasks:
    - name: Validate the installed exact-head bootstrap boundary
      ansible.builtin.include_tasks: tasks/reviewer-bootstrap-preflight.yml

    - name: Require explicit Writer-only credential staging authority
      ansible.builtin.assert:
        that:
          - relay_writer_credentials_authorized | bool
          - relay_writer_credential_source_file | default('') | length > 0
        fail_msg: WRITER_CREDENTIAL_STAGING_AUTHORIZATION_REQUIRED

  tasks:
    - name: Create a private temporary directory for the reviewed bootstrap helpers
      ansible.builtin.tempfile:
        state: directory
        path: '{{ relay_state_root }}'
        prefix: .writer-credential-helper-
      register: relay_writer_credential_helper_directory
      check_mode: false
      changed_when: false

    - name: Run the bounded Writer-only credential staging operation
      block:
        - name: Copy the reviewed helper and shared guard without credential material
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/tools/{{ item }}'
            dest: '{{ relay_writer_credential_helper_directory.path }}/{{ item }}'
            owner: root
            group: root
            mode: '0700'
          loop: [reviewer-credential-stage.py, bootstrap_guard.py]
          check_mode: false
          changed_when: false

        - name: Validate and atomically stage the existing Writer key without replacing material
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/python3', relay_writer_credential_helper_directory.path ~ '/reviewer-credential-stage.py',
                  '--source', relay_writer_credential_source_file,
                  '--destination', relay_writer_credential_key_file,
                  '--group', 'root', '--role', 'writer',
                  '--env-file', relay_writer_credential_env_file,
                  '--app-id', relay_writer_app_id | string,
                  '--installation-id', relay_writer_app_installation_id | string,
                  '--lock-file', relay_production_operation_lock_path,
                  '--operation-record', relay_production_operation_record_path,
                  '--manifest', relay_install_root ~ '/current/artifact-manifest.json',
                  '--exact-head', relay_production_exact_head]
                 + (['--check'] if ansible_check_mode else []) }}
          environment:
            PYTHONDONTWRITEBYTECODE: '1'
          register: relay_writer_credential_stage
          check_mode: false
          changed_when: >-
            relay_writer_credential_stage.rc == 0 and
            (relay_writer_credential_stage.stdout | from_json).changed | bool

        - name: Report only bounded Writer credential staging status
          ansible.builtin.debug:
            msg: >-
              {{ (relay_writer_credential_stage.stdout | from_json).proof }};
              status={{ (relay_writer_credential_stage.stdout | from_json).status }}

      always:
        - name: Remove the root-created temporary helper directory
          ansible.builtin.file:
            path: '{{ relay_writer_credential_helper_directory.path }}'
            state: absent
          check_mode: false
          changed_when: false
